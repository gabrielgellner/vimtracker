# The same checks as `just ci`, which is what pull requests run before they merge, on the
# author's machine (2026-11-11): the hosted runs were too slow and kept timing out. This one is
# kept to run by hand, from the Actions tab or `gh workflow run ci`.
#
# It runs on Apple silicon macOS because the render tests compare hashes of the audio, and the
# filter and reverb use library maths that can round differently on another platform.
name: ci

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
