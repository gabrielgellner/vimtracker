# Checks every pull request and every push to main.
#
# It runs on Apple silicon macOS because the render tests compare hashes of the audio, and the
# filter and reverb use library maths that can round differently on another platform.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # The Roto-Control's MIDI and serial crates build differently on Linux, through ALSA and /sys, so
  # the program is built there too, as the release builds it, and vt-roto's tests run, which need
  # no audio or MIDI device. The rest of the tests stay on macOS, for the render hashes above.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Retried, as a runner's package mirror sometimes fails to resolve for a few minutes.
      - name: Install ALSA headers
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 update \
              && sudo apt-get -o Acquire::Retries=3 install -y libasound2-dev pkg-config \
              && exit 0
            sleep 30
          done
          exit 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -p vt-roto --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --locked -p vt-tui --bin vimtracker

      - name: Test
        run: cargo test -p vt-roto --locked
