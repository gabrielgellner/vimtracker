# Builds the manual with mdBook and publishes it to GitHub Pages whenever main changes it.
# The manual includes the in-app guides, so a change to those publishes it too.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/manual/**"
      - "crates/vt-tui/guides/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a deploy already running is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      - name: Build
        run: mdbook build docs/manual

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/manual/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
