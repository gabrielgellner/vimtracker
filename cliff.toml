# The changelog, written by git-cliff from the commit history: `just changelog-preview` shows
# what the next release would add.

[changelog]
header = """
# Changelog\n
All notable changes to this project are written here, from the commit history.\n
"""
body = """
{% set repo = "https://github.com/gabrielgellner/vimtracker" %}\
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}[**breaking**] {% endif %}\
          {{ commit.message | split(pat="\n") | first | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`]({{ repo }}/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% set repo = "https://github.com/gabrielgellner/vimtracker" %}\
{% for release in releases %}\
    {% if release.version %}\
        {% if release.previous.version %}\
            [{{ release.version | trim_start_matches(pat="v") }}]: {{ repo }}/compare/{{ release.previous.version }}...{{ release.version }}\n
        {% else %}\
            [{{ release.version | trim_start_matches(pat="v") }}]: {{ repo }}/releases/tag/{{ release.version }}\n
        {% endif %}\
    {% else %}\
        {% if release.previous.version %}\
            [unreleased]: {{ repo }}/compare/{{ release.previous.version }}...HEAD\n
        {% endif %}\
    {% endif %}\
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# The history before releases isn't in Conventional Commits form, so those commits are kept,
# under Changes, rather than dropped. New commits use the types below.
filter_unconventional = false
split_commits = false
commit_parsers = [
    # Merge commits repeat the branch's own commits, which are listed already.
    { message = "^Merge pull request", skip = true },
    { message = "^Merge branch", skip = true },
    # Bringing main into a branch before it merges, which agents do instead of rebasing.
    { message = "^Merge remote-tracking branch", skip = true },
    { message = "^Merge main into", skip = true },
    { message = "^\\w+(\\(.*\\))?!?: merge ", skip = true },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Styling" },
    { message = "^docs", group = "Documentation" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^(chore|ci|build|test)", group = "Miscellaneous" },
    { body = ".*security", group = "Security" },
    { message = ".*", group = "Changes" },
]
protect_breaking_commits = false
filter_commits = true
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
