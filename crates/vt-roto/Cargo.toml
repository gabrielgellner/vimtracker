[package]
name = "vt-roto"
description = "Melbourne Instruments' Roto-Control for vimtracker: its SysEx, CC and serial protocols, a fake device, and the link to the real one"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
xxhash-rust.workspace = true
midir.workspace = true
serialport.workspace = true

[features]
# The Roto in memory (`fake`), for tests here and in vt-tui. Release builds leave it out.
fake = []

# The crate's own tests use the fake, so they turn it on through the crate itself.
[dev-dependencies]
vt-roto = { path = ".", features = ["fake"] }
