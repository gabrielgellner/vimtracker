[package]
name = "vt-tui"
description = "A Neovim-style terminal music tracker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vimtracker"
path = "src/main.rs"

# Its test checks every screenshot comes out the same twice.
[[example]]
name = "screenshots"
test = true

[dependencies]
vt-model.workspace = true
vt-engine.workspace = true
ratatui.workspace = true
cpal.workspace = true
clap.workspace = true
thiserror.workspace = true
base64.workspace = true
nucleo-matcher.workspace = true
hound.workspace = true
serde.workspace = true
ron.workspace = true
flate2.workspace = true
roxmltree.workspace = true
toml.workspace = true
# For `vimtracker bench --device`: a thread's own CPU time and how the system runs it, and the
# queues back from the callback it measures. The big image example also uses libc, to try
# sending through shared memory.
libc.workspace = true
rtrb.workspace = true
