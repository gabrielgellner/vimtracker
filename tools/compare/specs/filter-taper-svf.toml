# The clean types' Res knob against Cytomic's The Drop's OSR, an OTA state-variable filter like
# the OSCar's, at no drive: peak height, its frequency, the bass and self-oscillation, over 33
# steps at three cutoffs (#333). Written by taper_specs.py.
#
#   uv run run.py specs/filter-taper-svf.toml --report out/filter-taper-svf.html
rate = 48000
duration = 2.5

[input]
signal = "sweep"
from = 20.0
to = 20000.0
level = -30.0
seconds = 2.0

[ours]

[reference]
plugin = "/Library/Audio/Plug-Ins/VST3/The Drop.vst3"
buffer_size = 512

[reference.parameters]
lp_drive = 0.0
hp_drive = 0.0
lp_hd = true
hp_hd = true
lp_safe_res = false
hp_safe_res = false
lp_resmax = 125.0
hp_resmax = 125.0
lp_keytrack = false
hp_keytrack = false
mod_active = false
glide = "0.000 mS"
mix = 100.0
pad = 0.0

[report]
kind = "taper"
title = "Clean filters' Res against The Drop's OSR"
figure = ["filter", "mode"]
column = "cut"
knob = "res"
reference_knob = ["hp_res", "lp_res"]
width = ["BP", "Notch"]
about = """
Our track filter's clean types, the state-variable low-pass, high-pass, band-pass and notch at \
12 dB, against the OSR circuit of Cytomic's The Drop, an OTA state-variable filter like the \
OSCar's, at no drive. The band-pass is The Drop's high-pass and low-pass in series at the same \
frequency, and the notch the two in parallel, as its manual makes them.

Res is turned in 33 steps, 00 to FF, at three cutoffs, about 200 Hz, 988 Hz and 5 kHz, with \
the same quiet sine sweep as the other filter reports. The Drop's resonance runs from 0 to \
125% and self-oscillates above 100, so our knob's first 85%, 00 to D9, is set against its 0 to \
100%, and the last 15% against 100 to 125%.
"""

[[cases]]
name = "lp12-55-res00"
ours = { filter = "LP", mode = "12 dB", cut = 0x55, res = 0x00 }
reference = { lp_active = true, hp_active = false, lp_circuit = "OSR", lp_4_pole = false, lp_freq = 200.0, lp_res = 0.0 }

