references = { "The Drop" = { lp_active = true, hp_active = false, lp_circuit = "OSR", lp_4_pole = false, lp_freq = 200.0, lp_res = 95.0 }, "Filter SEM" = { cutoff_hz = 200.0, resonance = 0.95, bandpass_on_off = false, multi_mode = 0.0 } }

