# Every type and mode of our track filter that filter-clean and filter-ladder don't compare with a
# plugin, by a sine sweep's magnitude response at three cutoffs and Res 0, 50% and 90%: the clean
# types at 24 dB, the ladder's other modes, the diode ladder's low cuts, the Korg 35s and Vital's
# Dirty. There's no reference: each is measured against what the Sound page draws for it, from
# `vimtracker probe --response`.
#
#   uv run run.py specs/filter-ours.toml --report out/filter-ours.html

rate = 48000
duration = 2.5

[input]
signal = "sweep"
from = 20.0
to = 20000.0
level = -30.0
seconds = 2.0

[ours]

[report]
kind = "response"
title = "Our other filters against their drawings"
figure = ["filter", "mode"]
row = ""
column = "cut"
line = ["res"]
about = """
Every type and mode of our track filter that has no reference plugin here: the clean types at \
24 dB, the ladder's other modes, the diode ladder with each of its low cuts, the Korg 35 low-pass \
and high-pass from the MS-20, and Vital's Dirty filter in each of its modes. Each is given the same \
quiet sine sweep as the other filter reports, and the response is the output's spectrum over the \
input's.

With nothing to compare against, each is measured against its own drawing: the curve the Sound \
page draws for the same settings, which is worked out from the filter's equations rather than \
heard. Where the two part, the page shows something other than what plays.
"""

