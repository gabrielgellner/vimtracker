# Our Glue compressor against Ableton Live's Glue Compressor, which it's fitted to: the attack at
# each of Glue's seven, from a 1 kHz tone burst from -20 dBFS up to 0 dBFS and back (#338, #364).
# The last two cases are 10 ms at 2:1 and 10:1: Glue grabs faster at the higher ratio, as a
# feedback detector does.
#
#   uv run run.py specs/live-glue-attack.toml --report out/live-glue-attack.html

rate = 48000

[input]
signal = "burst"
frequency = 1000.0
rest = -20.0
level = 0.0
before = 0.5
on = 0.5
after = 1.0

[ours]
effects = ["comp"]

[ours.settings]
1.comp.type = "Glue"
1.comp.threshold = 0xD5       # -10 dB
1.comp.glueratio = "4:1"
1.comp.gluerelease = "0.1 s"
1.comp.range = 0xFF
1.comp.makeup = 0x00         # 0 dB, as Glue's Output
1.comp.auto = "Off"
1.comp.mix = 0xFF

[[references]]
name = "Glue"
live = "Glue Compressor"

[references.parameters]
Threshold = "-10 dB"
Ratio = 4
Release = 0.1
Output = "0 dB"
"Dry/Wet" = "100 %"

[report]
kind = "timing"
title = "Glue compressor attack against Glue Compressor"
about = """
Our Glue compressor, the Glue type of Comp, in a track's first slot against Ableton Live's Glue \
Compressor, which it's fitted to, by a tone burst: a 1 kHz sine at -20 dBFS for half a second, \
then 0 dBFS for the burst, then -20 dBFS again. Both thresholds are at -10 dBFS, so the burst is \
compressed and the rest isn't.

Each case is one of Glue's attacks at 4:1, all releasing at `.1`. The slower the attack, the less \
it turns down, as its release lets go all the while. The last two cases are 10 ms at 2:1 and 10:1, \
where the feedback detector grabs faster at the higher ratio.
"""

[[cases]]
name = "attack-0.01"
ours = { 1.comp.glueattack = "0.01 ms" }
references = { Glue = { Attack = 0.01 } }

[[cases]]
name = "attack-0.1"
ours = { 1.comp.glueattack = "0.1 ms" }
references = { Glue = { Attack = 0.1 } }

[[cases]]
name = "attack-0.3"
ours = { 1.comp.glueattack = "0.3 ms" }
references = { Glue = { Attack = 0.3 } }

[[cases]]
name = "attack-1"
ours = { 1.comp.glueattack = "1 ms" }
references = { Glue = { Attack = 1 } }

[[cases]]
name = "attack-3"
ours = { 1.comp.glueattack = "3 ms" }
references = { Glue = { Attack = 3 } }

[[cases]]
name = "attack-10"
ours = { 1.comp.glueattack = "10 ms" }
references = { Glue = { Attack = 10 } }

[[cases]]
name = "attack-30"
ours = { 1.comp.glueattack = "30 ms" }
references = { Glue = { Attack = 30 } }

[[cases]]
name = "attack-10-at-2"
ours = { 1.comp.glueattack = "10 ms", 1.comp.glueratio = "2:1" }
references = { Glue = { Attack = 10, Ratio = 2 } }

[[cases]]
name = "attack-10-at-10"
ours = { 1.comp.glueattack = "10 ms", 1.comp.glueratio = "10:1" }
references = { Glue = { Attack = 10, Ratio = 10 } }
