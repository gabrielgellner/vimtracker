# Our Bus compressor against Ableton Live's Glue Compressor, an SSL G-bus as ours is, and Arturia's
# Bus FORCE as comp-bus-static has it: the static curve at each of the Bus's ratios, from a 1 kHz
# sine stepped from -60 to 0 dBFS a dB at a time (#364). Glue has the G-bus's own ratios, 2, 4 and
# 10, so it's set to ours, where Bus FORCE's Force is set where its top 10 dB has our ratio.
#
# Glue renders through Live in real time, about 18 s a case, which needs Live open with the bridge
# (README, "Ableton Live's devices"); each render is cached, so a rerun doesn't.
#
#   uv run run.py specs/live-glue-static.toml --report out/live-glue-static.html

rate = 48000

[input]
signal = "steps"
frequency = 1000.0
from = -60.0
to = 0.0
step = 1.0
hold = 0.25

[ours]
effects = ["comp"]

[ours.settings]
1.comp.type = "Bus"
1.comp.threshold = 0xAA       # -20 dB
1.comp.busattack = "10 ms"
1.comp.busrelease = "0.1 s"
1.comp.makeup = 0x00         # 0 dB, as Glue's Makeup
1.comp.auto = "Off"
1.comp.mix = 0xFF

[[references]]
name = "Glue"
live = "Glue Compressor"

[references.parameters]
Threshold = "-20 dB"
Attack = "10 ms"
Release = "0.1 s"
Makeup = "0 dB"
"Dry/Wet" = "100 %"

[[references]]
name = "Bus FORCE"
plugin = "/Library/Audio/Plug-Ins/VST3/Bus FORCE.vst3"
buffer_size = 512

[references.parameters]
dry_path_mute = true
comp_path_mute = false
comp_path_level_db = 0.0
sat_path_mute = true
filter_on_off = false
eq_on_off = false
comp_on_off = true
comp_sc_filter = "Off"
comp_threshold_db = -20.0
comp_attack_ms = 10.0
comp_release_ms = 100.0
comp_make_up_gain_db = 0.0
saturation_on_off = false
auto_gain = false
output_clipping_on_off = false
input_trim_db = 0.0
output_trim_db = 0.0

[report]
kind = "static"
title = "Bus compressor static curve against Glue Compressor and Bus FORCE"
about = """
Our Bus compressor, the SSL G-bus type of Comp, in a track's first slot against Ableton Live's \
Glue Compressor, also modelled on the G-bus, and the compressor in Arturia's Bus FORCE, by their \
static curves: a 1 kHz sine stepped from -60 to 0 dBFS a decibel at a time, each level held a \
quarter of a second, with the output read once each step has settled.

Glue is set as ours: threshold -20 dB, the same ratio, a 10 ms attack and a 0.1 s release, no \
makeup, fully wet. Bus FORCE is as in comp-bus-static, its Force set where its top 10 dB has our \
ratio, 2.7, 4.3 and 5.25. The summary compares ours with Glue; Bus FORCE is drawn beside them.
"""

[[cases]]
name = "ratio-2"
ours = { 1.comp.busratio = "2:1" }
references = { Glue = { Ratio = 2 }, "Bus FORCE" = { comp_force = 2.7 } }

[[cases]]
name = "ratio-4"
ours = { 1.comp.busratio = "4:1" }
references = { Glue = { Ratio = 4 }, "Bus FORCE" = { comp_force = 4.3 } }

[[cases]]
name = "ratio-10"
ours = { 1.comp.busratio = "10:1" }
references = { Glue = { Ratio = 10 }, "Bus FORCE" = { comp_force = 5.25 } }
