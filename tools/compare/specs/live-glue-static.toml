# Our Glue compressor against Ableton Live's Glue Compressor, which it's fitted to: the static
# curve at each of Glue's ratios, from a 1 kHz sine stepped from -60 to 0 dBFS a dB at a time
# (#338, #364). Glue's knee is no setting of its own and softens as the ratio falls; ours is
# fitted to these curves, at Glue's 10 ms attack and `.1` release, which it settles lower with.
#
# Glue renders through Live in real time, about 18 s a case, which needs Live open with the bridge
# (README, "Ableton Live's devices"); each render is cached, so a rerun doesn't.
#
#   uv run run.py specs/live-glue-static.toml --report out/live-glue-static.html

rate = 48000

[input]
signal = "steps"
frequency = 1000.0
from = -60.0
to = 0.0
step = 1.0
hold = 0.25

[ours]
effects = ["comp"]

[ours.settings]
1.comp.type = "Glue"
1.comp.threshold = 0xAA       # -20 dB
1.comp.glueattack = "10 ms"
1.comp.gluerelease = "0.1 s"
1.comp.range = 0xFF          # 70 dB, as Glue loads
1.comp.makeup = 0x00         # 0 dB, as Glue's Output
1.comp.auto = "Off"
1.comp.mix = 0xFF

[[references]]
name = "Glue"
live = "Glue Compressor"

[references.parameters]
Threshold = "-20 dB"
Attack = 10
Release = 0.1
Output = "0 dB"
"Dry/Wet" = "100 %"

[report]
kind = "static"
title = "Glue compressor static curve against Glue Compressor"
about = """
Our Glue compressor, the Glue type of Comp, in a track's first slot against Ableton Live's Glue \
Compressor, which it's modelled on and fitted to, by their static curves: a 1 kHz sine stepped \
from -60 to 0 dBFS a decibel at a time, each level held a quarter of a second, with the output \
read once each step has settled.

Both are set alike: threshold -20 dB, the same ratio, a 10 ms attack and a 0.1 s release, all of \
their range, no makeup, fully wet. Glue's knee isn't a setting: it starts 25 dB under the \
threshold at 2:1 and 3 dB over it at 10:1. The console type, fitted to Bus FORCE, is measured \
against that in comp-bus-static.
"""

[[cases]]
name = "ratio-2"
ours = { 1.comp.glueratio = "2:1" }
references = { Glue = { Ratio = 2 } }

[[cases]]
name = "ratio-4"
ours = { 1.comp.glueratio = "4:1" }
references = { Glue = { Ratio = 4 } }

[[cases]]
name = "ratio-10"
ours = { 1.comp.glueratio = "10:1" }
references = { Glue = { Ratio = 10 } }
