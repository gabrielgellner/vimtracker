# The MS20 types' Res knob against Cytomic's The Drop's MS1, the MS-20's first Korg 35, with its hard clipper, at two poles and
# no drive, over 33 steps at three cutoffs (#333). Written by taper_specs.py.
#
#   uv run run.py specs/filter-taper-ms20.toml --report out/filter-taper-ms20.html
rate = 48000
duration = 2.5

[input]
signal = "sweep"
from = 20.0
to = 20000.0
level = -30.0
seconds = 2.0

[ours]

[reference]
plugin = "/Library/Audio/Plug-Ins/VST3/The Drop.vst3"
buffer_size = 512

[reference.parameters]
lp_drive = 0.0
hp_drive = 0.0
lp_hd = true
hp_hd = true
lp_safe_res = false
hp_safe_res = false
lp_resmax = 125.0
hp_resmax = 125.0
lp_keytrack = false
hp_keytrack = false
mod_active = false
glide = "0.000 mS"
mix = 100.0
pad = 0.0

[report]
kind = "taper"
title = "MS20 types' Res against The Drop's MS1"
figure = ["filter", "mode"]
column = "cut"
knob = "res"
reference_knob = ["hp_res", "lp_res"]
width = []
about = """
Our track filter's MS20 LP and MS20 HP, Korg 35s, against the MS1 circuit of Cytomic's The \
Drop, the MS-20's first Korg 35, with its hard clipper, at two poles and no drive.

Res is turned in 33 steps, 00 to FF, at three cutoffs, about 200 Hz, 988 Hz and 5 kHz, with \
the same quiet sine sweep as the other filter reports. The Drop's resonance runs from 0 to \
125% and self-oscillates above 100, so our knob's first 85%, 00 to D9, is set against its 0 to \
100%, and the last 15% against 100 to 125%.
"""

[[cases]]
name = "ms20lp-55-res00"
ours = { filter = "MS20 LP", cut = 0x55, res = 0x00 }
reference = { lp_active = true, hp_active = false, lp_circuit = "MS1", lp_4_pole = false, lp_freq = 200.0, lp_res = 0.0 }

