name = "C0R0E0D0A0"
ours = { acid.cutoff = 0x00, acid.resonance = 0x00, acid.envmod = 0x00, acid.decay = 0x00, acid.accent = 0x00 }
references = { "Acid V" = { cutoff = 0.0, resonance = 0.0, envelope_mod = 0.0, decay = 0.0, accent = 0.0 }, ABL3 = { cutoff = 0.0, resonance = 0.0, envmod = 0.0, decay = 0.0, accent = 0.0 } }
notes = [
  { time = 0.05, length = 0.0625, note = 36, velocity = 99, accent = false },
