# Every Acid knob at its bottom or top, with every other's, 32 cases, against Arturia's Acid V
# and AudioRealism's ABL3, for the nuance suite (#347). Written by nuance_specs.py.
#
#   uv run run.py specs/nuance-extremes.toml --report out/nuance-extremes.html

rate = 48000
duration = 1.0

[ours]
machine = "acid"

[ours.settings]
acid.wave = "Saw"
acid.drive = 0x00
acid.cutoff = 0x00
acid.resonance = 0x00
acid.envmod = 0x00
acid.decay = 0x00
acid.accent = 0x00

[[references]]
name = "Acid V"
plugin = "/Library/Audio/Plug-Ins/VST3/Acid V.vst3"
buffer_size = 512
accent_from = 100
preset = "Default"
state = { Sequencer_OnOff = 0 }

[references.parameters]
master_volume_db = 0.0
osc_pitch_st = 12.0
osc_waveform = 0.0
distortion_dry_wet = 0.0
sub_osc_volume_db = -70.0
noise_db = -100.0
cutoff = 0.0
resonance = 0.0
envelope_mod = 0.0
decay = 0.0
accent = 0.0

[[references]]
name = "ABL3"
plugin = "/Library/Audio/Plug-Ins/VST3/ABL3x.vst3"
buffer_size = 512
channels = 1
accent_from = 101
preroll = 1.0
wake_note = 60
state = { MidiMode = 1, VCAClicks = 0, OutputClipping = 0 }

[references.parameters]
waveform = "303 Saw"
volume = 0.75
highpass = 0.0
drive = 0.0
distort = 0.0
reso_trim = 0.5
gate_trim = 0.5
vcf_trim = 0.5
bass_boost = 0.5
treble_boost = 0.5
detune = 0.5
pregain = 0.0
vco_base = 0.5
noise_level = 0.0
vco_shift = 0.0
cutoff = 0.0
resonance = 0.0
envmod = 0.0
decay = 0.0
accent = 0.0

[report]
kind = "notes"
title = "Every knob's extremes together, against Acid V and ABL3"
columns = 4
step = 0.125
about = """
Cutoff, Res, Env Mod, Decay and Accent each at the bottom or the top of its turn, every \
one of the 32 ways, each playing two plain C-2s and two accents a sixteenth apart at \
120 BPM. A case's name gives each knob's end, C for Cutoff, R Res, E Env Mod, D Decay and \
A Accent, 0 at the bottom and F at the top: `C0R0E0D0A0` has them all down. It's where \
knobs that each fit on their own can still part, as they interact.

Every case renders on three sides: our Acid, Arturia's Acid V on its Default preset with its \
sequencer off, and AudioRealism's ABL3 set up as a stock 303, in its Note mode. Where Acid V \
and ABL3 agree, that's the target; where they disagree, both are shown. Acid V accents a note \
from velocity 100, ABL3 from 101 and ours from 0x70, so a plain note plays at 99 and an \
accent at 0x70 on every side.
"""

