# Our Console compressor against the compressor in Arturia's Bus FORCE, its other paths muted: the
# static curve at each of Console's ratios, from a 1 kHz sine stepped from -60 to 0 dBFS a dB at a
# time. Bus FORCE's Force knob has no ratio on it, and its curve steepens the harder it's driven,
# so it's set where its top 10 dB has our ratio: 2.7, 4.3 and 5.25. Console's knee and where its
# line sits are fitted to these (#338).
#
#   uv run run.py specs/comp-bus-static.toml --report out/comp-bus-static.html

rate = 48000

[input]
signal = "steps"
frequency = 1000.0
from = -60.0
to = 0.0
step = 1.0
hold = 0.25

[ours]
effects = ["comp"]

[ours.settings]
1.comp.type = "Console"
1.comp.threshold = 0xAA       # -20 dB
1.comp.consoleattack = "10 ms"
1.comp.consolerelease = "0.1 s"
1.comp.mix = 0xFF

[reference]
plugin = "/Library/Audio/Plug-Ins/VST3/Bus FORCE.vst3"
buffer_size = 512

[reference.parameters]
dry_path_mute = true
comp_path_mute = false
comp_path_level_db = 0.0
sat_path_mute = true
filter_on_off = false
eq_on_off = false
comp_on_off = true
comp_sc_filter = "Off"
comp_threshold_db = -20.0
comp_attack_ms = 10.0
comp_release_ms = 100.0
comp_make_up_gain_db = 0.0
saturation_on_off = false
auto_gain = false
output_clipping_on_off = false
input_trim_db = 0.0
output_trim_db = 0.0

[report]
kind = "static"
title = "Console compressor static curve against Bus FORCE"
about = """
Our Console compressor, the SSL console type of Comp, in a track's first slot against the compressor in \
Arturia's Bus FORCE, by its static curve: a 1 kHz sine stepped from -60 to 0 dBFS a decibel at a \
time, each level held a quarter of a second, with the output read once each step has settled.

Bus FORCE's dry and saturation paths are muted, and its filter, EQ, side-chain filter, auto gain \
and clipper are off, so only its compressor path is heard. Both thresholds are at -20 dBFS, and \
both attacks 10 ms and releases 100 ms. Bus FORCE's Force knob has no ratio printed on it and its \
curve steepens the harder it's driven, so it's set where its top 10 dB has Console's ratio: 2.7 \
for 2:1, 4.3 for 4:1 and 5.25 for 10:1. Console's knee, and how far over the threshold its line \
sits, are fitted to these curves, as the G-bus's ratio switch moves its own threshold.
"""

[[cases]]
name = "ratio-2"
ours = { 1.comp.consoleratio = "2:1" }
reference = { comp_force = 2.7 }

[[cases]]
name = "ratio-4"
ours = { 1.comp.consoleratio = "4:1" }
reference = { comp_force = 4.3 }

[[cases]]
name = "ratio-10"
ours = { 1.comp.consoleratio = "10:1" }
reference = { comp_force = 5.25 }
