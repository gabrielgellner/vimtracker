# Decision 117's `acid-accent` against both references, Arturia's Acid V and AudioRealism's
# ABL3, for the nuance suite (#347). Written by nuance_specs.py.
#
#   uv run run.py specs/nuance-knob-accent.toml --report out/nuance-knob-accent.html

rate = 48000
duration = 1.35

