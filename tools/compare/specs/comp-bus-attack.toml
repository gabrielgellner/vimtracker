# Our Bus compressor against the compressor in Arturia's Bus FORCE, its other paths muted: the
# attack at each of the Bus's six, from a 1 kHz tone burst from -20 dBFS up to 0 dBFS and back. The
# Bus's attacks from 1 ms up are fitted to these at 4:1 (#338). Bus FORCE goes no faster than 1 ms,
# so the Bus's 0.1 and 0.3 ms are set against its 1 ms. The 10 ms attack at 2:1 and 10:1 shows the
# Bus's feedback: the loop grabs faster at a higher ratio, where Bus FORCE's attack doesn't move.
#
#   uv run run.py specs/comp-bus-attack.toml --report out/comp-bus-attack.html

rate = 48000

[input]
signal = "burst"
frequency = 1000.0
rest = -20.0
level = 0.0
before = 0.5
on = 0.5
after = 1.0

[ours]
effects = ["comp"]

[ours.settings]
1.comp.type = "Bus"
1.comp.threshold = 0xD5       # -10 dB
1.comp.busratio = "4:1"
1.comp.busrelease = "0.1 s"
1.comp.mix = 0xFF

[reference]
plugin = "/Library/Audio/Plug-Ins/VST3/Bus FORCE.vst3"
buffer_size = 512

[reference.parameters]
dry_path_mute = true
comp_path_mute = false
comp_path_level_db = 0.0
sat_path_mute = true
filter_on_off = false
eq_on_off = false
comp_on_off = true
comp_sc_filter = "Off"
comp_threshold_db = -10.0
comp_force = 4.3
comp_release_ms = 100.0
comp_make_up_gain_db = 0.0
saturation_on_off = false
auto_gain = false
output_clipping_on_off = false
input_trim_db = 0.0
output_trim_db = 0.0

[report]
kind = "timing"
title = "Bus compressor attack against Bus FORCE"
about = """
Our Bus compressor, the SSL G-bus type of Comp, in a track's first slot against the compressor in \
Arturia's Bus FORCE, by a tone burst: a 1 kHz sine at -20 dBFS for half a second, then 0 dBFS for \
the burst, then -20 dBFS again. Both thresholds are at -10 dBFS, so the burst is compressed and \
the rest isn't, and the gain falls as the burst starts and recovers after it ends.

Each case is one of the Bus's attacks at 4:1, against Bus FORCE at the same time with its Force \
at 4.3, where its top 10 dB is 4:1; both release in 100 ms. Bus FORCE goes no faster than 1 ms, \
so the Bus's 0.1 and 0.3 ms are set against its 1 ms. The Bus's detector hears what it has already \
turned down, as the G-bus's does, so its attack is quicker at a higher ratio: the last two cases \
are 10 ms at 2:1 and 10:1, against Bus FORCE at 2.7 and 5.25.
"""

[[cases]]
name = "attack-0.1"
ours = { 1.comp.busattack = "0.1 ms" }
reference = { comp_attack_ms = 1.0 }

[[cases]]
name = "attack-0.3"
ours = { 1.comp.busattack = "0.3 ms" }
reference = { comp_attack_ms = 1.0 }

[[cases]]
name = "attack-1"
ours = { 1.comp.busattack = "1 ms" }
reference = { comp_attack_ms = 1.0 }

[[cases]]
name = "attack-3"
ours = { 1.comp.busattack = "3 ms" }
reference = { comp_attack_ms = 3.0 }

[[cases]]
name = "attack-10"
ours = { 1.comp.busattack = "10 ms" }
reference = { comp_attack_ms = 10.0 }

[[cases]]
name = "attack-30"
ours = { 1.comp.busattack = "30 ms" }
reference = { comp_attack_ms = 30.0 }

[[cases]]
name = "attack-10-at-2"
ours = { 1.comp.busattack = "10 ms", 1.comp.busratio = "2:1" }
reference = { comp_attack_ms = 10.0, comp_force = 2.7 }

[[cases]]
name = "attack-10-at-10"
ours = { 1.comp.busattack = "10 ms", 1.comp.busratio = "10:1" }
reference = { comp_attack_ms = 10.0, comp_force = 5.25 }
