# Distort's `Distortion` pedal against Ableton Live's Pedal in its Distortion mode, and Arturia's
# Dist OPAMP-21 in its `Modern` mode as pedal-distortion-harmonics has it: the harmonics each adds
# to a sine held at stepped levels, at three drives (#364). Our `Amount`'s `40`, `80` and `FF` are
# OPAMP-21's 25, 50 and 100% `Drive`, and are set against Pedal's Gain at the same.
#
#   uv run run.py specs/live-pedal-distortion.toml --report out/live-pedal-distortion.html

rate = 48000

[input]
signal = "steps"
frequency = 110.0
from = -54.0
to = 0.0
step = 6.0
hold = 0.4

[ours]
effects = ["distort"]

[ours.settings]
1.distort.type = "Distortion"
1.distort.tone = 0xFF
1.distort.mix = 0xFF

[[references]]
name = "Pedal"
live = "Pedal"

[references.parameters]
Type = "Distortion"
Output = "0 dB"
"Dry/Wet" = "100 %"

[[references]]
name = "Dist OPAMP-21"
plugin = "/Library/Audio/Plug-Ins/VST3/Dist OPAMP-21.vst3"
buffer_size = 512
preset = "Default"

[references.parameters]
mode = "Modern"
post_eq_on = false
dry_wet = 100.0
presence = 0.0
high = 100.0
output_db = 0.0
input_hpf_hz = 20.0
input_lpf_hz = 20000.0

[report]
kind = "distortion"
title = "Distortion's clip against Live's Pedal and Dist OPAMP-21"
about = """
Our Distort slot's `Distortion` type, an op-amp distortion, against Ableton Live's Pedal in its \
Distortion mode, fully wet, its output at 0 dB and its Bass, Mid and Treble where they load, and \
Arturia's Dist OPAMP-21 in its `Modern` mode, which has no tone stack, with its post EQ off: the \
harmonics each adds to a 110 Hz or 1 kHz sine held at -54 to 0 dBFS, 6 dB apart. Our `Tone` is \
fully open, at 12 kHz.

`Amount` is fitted so its place is OPAMP-21's `Drive`; Pedal's Gain is set to the same place, \
unfitted. The summary compares ours with Pedal; OPAMP-21 is drawn beside them.
"""

[[cases]]
name = "drive-25"
ours = { 1.distort.amount = 0x40 }
references = { Pedal = { Gain = "25 %" }, "Dist OPAMP-21" = { drive = 25.0 } }

[[cases]]
name = "drive-50"
ours = { 1.distort.amount = 0x80 }
references = { Pedal = { Gain = "50 %" }, "Dist OPAMP-21" = { drive = 50.0 } }

[[cases]]
name = "drive-100"
ours = { 1.distort.amount = 0xFF }
references = { Pedal = { Gain = "100 %" }, "Dist OPAMP-21" = { drive = 100.0 } }

[[cases]]
name = "drive-50-1kHz"
ours = { 1.distort.amount = 0x80 }
references = { Pedal = { Gain = "50 %" }, "Dist OPAMP-21" = { drive = 50.0 } }
input = { frequency = 1000.0 }
