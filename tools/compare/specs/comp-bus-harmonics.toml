# Our Console compressor against the compressor in Arturia's Bus FORCE, its other paths muted: the
# harmonics each adds to a sine at stepped levels, at 100 Hz and 1 kHz, with a fast attack, to
# see whether Bus FORCE's compressor has a VCA's colour for the Bus to copy (#338). It has none:
# no 2nd harmonic at any level, and odd ones only once it turns down, from its gain following
# the wave, so Console adds none of its own.
#
#   uv run run.py specs/comp-bus-harmonics.toml --report out/comp-bus-harmonics.html

rate = 48000

[input]
signal = "steps"
frequency = 100.0
from = -30.0
to = 0.0
step = 6.0
hold = 0.5

[ours]
effects = ["comp"]

[ours.settings]
1.comp.type = "Console"
1.comp.threshold = 0xAA       # -20 dB
1.comp.consoleratio = "4:1"
1.comp.consoleattack = "1 ms"
1.comp.consolerelease = "0.1 s"
1.comp.mix = 0xFF

[reference]
plugin = "/Library/Audio/Plug-Ins/VST3/Bus FORCE.vst3"
buffer_size = 512

[reference.parameters]
dry_path_mute = true
comp_path_mute = false
comp_path_level_db = 0.0
sat_path_mute = true
filter_on_off = false
eq_on_off = false
comp_on_off = true
comp_sc_filter = "Off"
comp_threshold_db = -20.0
comp_force = 4.3
comp_attack_ms = 1.0
comp_release_ms = 100.0
comp_make_up_gain_db = 0.0
saturation_on_off = false
auto_gain = false
output_clipping_on_off = false
input_trim_db = 0.0
output_trim_db = 0.0

[report]
kind = "distortion"
title = "Console compressor harmonics against Bus FORCE"
about = """
Our Console compressor, the SSL console type of Comp, in a track's first slot against the compressor in \
Arturia's Bus FORCE, by the harmonics each adds to a sine held at -30, -24, -18, -12, -6 and 0 \
dBFS, half a second each, at 100 Hz and at 1 kHz. Both are at 4:1, with Bus FORCE's Force at 4.3, \
thresholds of -20 dBFS, a 1 ms attack and a 100 ms release, so the top levels are turned down \
hard and fast, where a compressor's gain follows the wave the most.

A VCA's colour shows as a 2nd harmonic that grows with level, whether or not it's turning down. \
Console adds colour only if Bus FORCE's compressor does.
"""

[[cases]]
name = "100Hz"

[[cases]]
name = "1kHz"
input = { frequency = 1000.0 }
