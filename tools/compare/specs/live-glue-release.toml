# Our Glue compressor against Ableton Live's Glue Compressor, which it's fitted to: each of Glue's
# set releases after a burst, and its Auto release after bursts from 20 ms to 2 s (#338, #364).
# Glue's release names aren't the times they take: `.1` lets go in about 80 ms.
#
#   uv run run.py specs/live-glue-release.toml --report out/live-glue-release.html

rate = 48000

[input]
signal = "burst"
frequency = 1000.0
rest = -20.0
level = 0.0
before = 0.5
on = 0.5
after = 6.0

[ours]
effects = ["comp"]

[ours.settings]
1.comp.type = "Glue"
1.comp.threshold = 0xD5       # -10 dB
1.comp.glueratio = "4:1"
1.comp.glueattack = "1 ms"
1.comp.range = 0xFF
1.comp.makeup = 0x00         # 0 dB, as Glue's Output
1.comp.auto = "Off"
1.comp.mix = 0xFF

[[references]]
name = "Glue"
live = "Glue Compressor"

[references.parameters]
Threshold = "-10 dB"
Ratio = 4
Attack = 1
Output = "0 dB"
"Dry/Wet" = "100 %"

[report]
kind = "timing"
title = "Glue compressor release against Glue Compressor"
about = """
Our Glue compressor, the Glue type of Comp, in a track's first slot against Ableton Live's Glue \
Compressor, which it's fitted to, by a tone burst: a 1 kHz sine at -20 dBFS, then 0 dBFS for the \
burst, then -20 dBFS again. Both thresholds are at -10 dBFS, both at 4:1 with a 1 ms attack.

The first cases are Glue's set releases, `.1`, `.6` and `1.2` after a half-second burst and a 50 ms \
one, which let go as fast after each, and `.2`, `.4` and `.8` after a 0.3 s burst. Each lets go \
as one exponential in dB, quicker than its name says. The rest are both at Auto, after bursts \
from 20 ms to 2 s: it lets go of a short peak quickly and a long squeeze slowly, as the SSL's two \
capacitors do.
"""

[[cases]]
name = "release-0.1-long"
ours = { 1.comp.gluerelease = "0.1 s" }
references = { Glue = { Release = 0.1 } }

[[cases]]
name = "release-0.1-short"
ours = { 1.comp.gluerelease = "0.1 s" }
references = { Glue = { Release = 0.1 } }
input = { on = 0.05 }

[[cases]]
name = "release-0.2"
ours = { 1.comp.gluerelease = "0.2 s" }
references = { Glue = { Release = 0.2 } }
input = { before = 0.3, on = 0.3, after = 2.5 }

[[cases]]
name = "release-0.4"
ours = { 1.comp.gluerelease = "0.4 s" }
references = { Glue = { Release = 0.4 } }
input = { before = 0.3, on = 0.3, after = 2.5 }

[[cases]]
name = "release-0.6-long"
ours = { 1.comp.gluerelease = "0.6 s" }
references = { Glue = { Release = 0.6 } }

[[cases]]
name = "release-0.6-short"
ours = { 1.comp.gluerelease = "0.6 s" }
references = { Glue = { Release = 0.6 } }
input = { on = 0.05 }

[[cases]]
name = "release-0.8"
ours = { 1.comp.gluerelease = "0.8 s" }
references = { Glue = { Release = 0.8 } }
input = { before = 0.3, on = 0.3, after = 2.5 }

[[cases]]
name = "release-1.2-long"
ours = { 1.comp.gluerelease = "1.2 s" }
references = { Glue = { Release = 1.2 } }

[[cases]]
name = "auto-20ms"
ours = { 1.comp.gluerelease = "Auto" }
references = { Glue = { Release = "A" } }
input = { on = 0.02 }

[[cases]]
name = "auto-200ms"
ours = { 1.comp.gluerelease = "Auto" }
references = { Glue = { Release = "A" } }
input = { on = 0.2 }

[[cases]]
name = "auto-2s"
ours = { 1.comp.gluerelease = "Auto" }
references = { Glue = { Release = "A" } }
input = { on = 2.0 }
