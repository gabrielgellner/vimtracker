# Arturia's Acid V against our Acid: the diode ladder's response read from one held C-2's
# harmonics, at three cutoffs and Res 0, 50% and 90%. The Acid's filter is inside the voice, where
# the probe can't feed it a sweep, so its shape is read from the sawtooth it filters, a second
# into the note, once the filter's envelope has decayed: Env Mod and Decay are at 0 on both, so the
# cutoff then holds still. Acid V's distortion and sub oscillator are off, as our Acid has neither.
#
#   uv run run.py specs/acid-filter.toml --report out/acid-filter.html

rate = 48000
duration = 2.5

[[notes]]
time = 0.05
length = 2.4
note = 36          # C-2 in the program, as MIDI numbers it
velocity = 99      # under an accent on both sides: Acid V accents from 100, ours from 0x70

[ours]
machine = "acid"

[ours.settings]
acid.wave = "Saw"
acid.envmod = 0x00
acid.decay = 0x00
acid.accent = 0x80
acid.drive = 0x00

[reference]
plugin = "/Library/Audio/Plug-Ins/VST3/Acid V.vst3"
buffer_size = 512
# Acid V opens with whatever preset it last had, so each case starts from its factory Default,
# with its sequencer off so a held key plays one note rather than a pattern (arturia.py).
preset = "Default"
state = { Sequencer_OnOff = 0 }

[reference.parameters]
master_volume_db = 0.0
osc_pitch_st = 12.0        # Acid V plays MIDI 36 at 32.7 Hz, an octave under ours
osc_waveform = 0.0
envelope_mod = 0.0
decay = 0.0
accent = 0.5
distortion_dry_wet = 0.0
sub_osc_volume_db = -70.0
noise_db = -100.0          # its hiss, which would brighten a quiet note's centroid

[report]
kind = "harmonics"
title = "Acid's filter against Acid V, from a held note"
row = "acid.resonance"
column = "acid.cutoff"
window = [1.0, 2.0]
about = """
The Acid voice's filter is a diode ladder inside the voice, where the probe can't feed it a sweep, \
so its shape is read through the voice instead: one held C-2 sawtooth, whose harmonics fall as \
one over their number, so multiplying each by its number leaves the filter's shape. Our Acid and \
Arturia's Acid V play the same note at three cutoffs, the knobs' bottom, middle and top, and at \
Res 0, 50% and 90%.

Env Mod and Decay are at 0 on both, and the harmonics are measured a second into the note, once \
the filter's envelope has decayed, so the cutoff holds still while it's measured. The track \
filter's Diode type is the same ladder fed a sweep; it's in the report of our other filters.

Acid V opens with whatever preset it last had, which here was a sequence that plays its own \
pattern from a held key, so each case starts from its factory Default preset with its sequencer \
switched off. It plays MIDI 36 an octave under ours, at 32.7 Hz, so its oscillator is raised 12 \
semitones to play the same pitch. Its distortion and sub oscillator are off, as our Acid has \
neither.
"""

[[cases]]
name = "cutoff-00-res0"
ours = { acid.cutoff = 0x00, acid.resonance = 0x00 }
reference = { cutoff = 0.0, resonance = 0.0 }

[[cases]]
name = "cutoff-00-res50"
ours = { acid.cutoff = 0x00, acid.resonance = 0x80 }
reference = { cutoff = 0.0, resonance = 0.5 }

[[cases]]
name = "cutoff-00-res90"
ours = { acid.cutoff = 0x00, acid.resonance = 0xE6 }
reference = { cutoff = 0.0, resonance = 0.9 }

[[cases]]
name = "cutoff-80-res0"
ours = { acid.cutoff = 0x80, acid.resonance = 0x00 }
reference = { cutoff = 0.5, resonance = 0.0 }

[[cases]]
name = "cutoff-80-res50"
ours = { acid.cutoff = 0x80, acid.resonance = 0x80 }
reference = { cutoff = 0.5, resonance = 0.5 }

[[cases]]
name = "cutoff-80-res90"
ours = { acid.cutoff = 0x80, acid.resonance = 0xE6 }
reference = { cutoff = 0.5, resonance = 0.9 }

[[cases]]
name = "cutoff-FF-res0"
ours = { acid.cutoff = 0xFF, acid.resonance = 0x00 }
reference = { cutoff = 1.0, resonance = 0.0 }

[[cases]]
name = "cutoff-FF-res50"
ours = { acid.cutoff = 0xFF, acid.resonance = 0x80 }
reference = { cutoff = 1.0, resonance = 0.5 }

[[cases]]
name = "cutoff-FF-res90"
ours = { acid.cutoff = 0xFF, acid.resonance = 0xE6 }
reference = { cutoff = 1.0, resonance = 0.9 }
