# How the Space Echo's head opens as the tape speeds up, against Delay TAPE-201 (#712, decision
# 337): a quiet click through the first head with nothing fed back, so there's one repeat, read
# whole, at first heads from 1 s down to 10 ms. A tape's highs go further the faster it runs.
#
#   uv run run.py specs/echo-speed.toml --report out/echo-speed.html

rate = 48000

[input]
signal = "impulse"
level = -34.0
seconds = 1.5

[ours]
effects = ["echo"]

[ours.settings]
1.echo.mode = 0
1.echo.intensity = 0x00
1.echo.wow = 0x00
1.echo.reverb = 0x00
1.echo.mix = 0xFF

[reference]
plugin = "/Library/Audio/Plug-Ins/VST3/Delay TAPE-201.vst3"
buffer_size = 512
preset = "Default"
preroll = 3.0

[reference.parameters]
rates_sync = false
rates_link = true
mode_selector = "1"
dry_wet = 1.0
echo_amount = 1.0
reverb_amount = 0.0
intensity = 0.0
flutter = 0.0
noise = 0.0
input_drive_db = 0.0
stereo_width = 0.0
stereo_rate_offset = 0.0
bass = 0.0
treble = 0.0
delay_type = "L/R"
input_eq_on_off = false
lfo_destination = "None"

[report]
kind = "echo"
measure = "tone"
at = 0.0
period = 0.0
count = 1
title = "Space Echo's head against tape speed, against TAPE-201"
about = """
A click at -34 dBFS through the first head alone, all wet, with nothing fed back, so the one \
repeat is the record and playback heads' response, at first heads of 1 s, 400, 150, 100, 50 and \
10 ms: our `Rate` `00`, `33`, `69`, `80`, `A6` and `FF`.
"""

[[cases]]
name = "1000-ms"
ours = { 1.echo.rate = 0x00 }
reference = { repeat_rate_left_ms = 1000.0, repeat_rate_right_ms = 1000.0 }

[[cases]]
name = "400-ms"
ours = { 1.echo.rate = 0x33 }
reference = { repeat_rate_left_ms = 400.0, repeat_rate_right_ms = 400.0 }

[[cases]]
name = "150-ms"
ours = { 1.echo.rate = 0x69 }
reference = { repeat_rate_left_ms = 150.0, repeat_rate_right_ms = 150.0 }

[[cases]]
name = "100-ms"
ours = { 1.echo.rate = 0x80 }
reference = { repeat_rate_left_ms = 99.0, repeat_rate_right_ms = 99.0 }

[[cases]]
name = "50-ms"
ours = { 1.echo.rate = 0xA6 }
reference = { repeat_rate_left_ms = 50.0, repeat_rate_right_ms = 50.0 }

[[cases]]
name = "10-ms"
ours = { 1.echo.rate = 0xFF }
reference = { repeat_rate_left_ms = 10.0, repeat_rate_right_ms = 10.0 }
