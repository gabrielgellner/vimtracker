# Arturia's Comp VCA-65 against our compressor in slot 1: a 1 kHz sine stepped from -60 to 0 dBFS a
# dB at a time, each level held a quarter of a second, for the static curve. Both thresholds are at
# -20 dB on their own scales, with ratios of about 2, 4 and 8 to 1 on ours against a quarter, half
# and three quarters of Comp VCA-65's Compression knob, whose mapping is what the comparison shows.
#
#   uv run run.py specs/comp-static.toml --report out/comp-static.html

rate = 48000

[input]
signal = "steps"
frequency = 1000.0
from = -60.0
to = 0.0
step = 1.0
hold = 0.25

[ours]
effects = ["comp"]

[ours.settings]
1.comp.threshold = 0xAA   # -20 dB
1.comp.attack = 0x55      # 1 ms
1.comp.release = 0x80     # 100 ms
1.comp.auto = "Off"
1.comp.mix = 0xFF

[reference]
plugin = "/Library/Audio/Plug-Ins/VST3/Comp VCA-65.vst3"
buffer_size = 512

[reference.parameters]
threshold = -20.0
attack_time = 0.5
release_time = 0.5
auto_att_rel = false
output_gain_db = 0.0
mix = 100.0

[report]
kind = "static"
title = "Compressor static curve against Comp VCA-65"
about = """
Our compressor in a track's first slot against Arturia's Comp VCA-65, a model of the dbx 165A, by \
its static curve: a 1 kHz sine stepped from -60 to 0 dBFS a decibel at a time, each level held a \
quarter of a second, with the output read once each step has settled.

Both thresholds are at -20 on their own scales. Our ratios of 2, 4 and 8 to 1 are set against a \
quarter, half and three quarters of Comp VCA-65's Compression knob, which has no ratio printed on \
it, so the ratio measured is its mapping. Our attack is 1 ms and our release 100 ms; Comp VCA-65's \
attack and release knobs are at noon, with its automatic attack and release off.
"""

[[cases]]
name = "ratio-2"
ours = { 1.comp.ratio = 0x3B }   # 2.0:1
reference = { compression = 0.25 }

[[cases]]
name = "ratio-4"
ours = { 1.comp.ratio = 0x65 }   # 4.0:1
reference = { compression = 0.5 }

[[cases]]
name = "ratio-8"
ours = { 1.comp.ratio = 0x9B }   # 8.0:1
reference = { compression = 0.75 }
