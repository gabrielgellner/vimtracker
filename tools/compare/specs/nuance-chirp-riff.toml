# A song's Acid line against Arturia's Acid V and AudioRealism's ABL3, for the chirp (#348,
# #349). The notes, tempo and knobs are read from the song each time it runs, by `vimtracker
# notes`, and the whole spec is written into out/songs/ (song_line.py). Written by
# nuance_specs.py.
#
#   uv run run.py specs/nuance-chirp-riff.toml --report out/nuance-chirp-riff.html

[song]
project = "~/Music/vimtracker/projects/303-patterns/confusion-pump-panel"
machine = "acid"
