# One note held from a 128th to a quarter note, against Arturia's Acid V and AudioRealism's
# ABL3, for the nuance suite (#347). Written by nuance_specs.py.
#
#   uv run run.py specs/nuance-gate.toml --report out/nuance-gate.html

rate = 48000
duration = 1.0

[ours]
machine = "acid"

[ours.settings]
acid.wave = "Saw"
acid.drive = 0x00
acid.cutoff = 0x80
acid.resonance = 0x40
acid.envmod = 0x80
acid.decay = 0x80
acid.accent = 0x80

[[references]]
name = "Acid V"
plugin = "/Library/Audio/Plug-Ins/VST3/Acid V.vst3"
buffer_size = 512
accent_from = 100
preset = "Default"
state = { Sequencer_OnOff = 0 }

[references.parameters]
master_volume_db = 0.0
osc_pitch_st = 12.0
osc_waveform = 0.0
distortion_dry_wet = 0.0
sub_osc_volume_db = -70.0
noise_db = -100.0
cutoff = 0.5
resonance = 0.25
envelope_mod = 0.5
decay = 0.5
accent = 0.5

[[references]]
name = "ABL3"
plugin = "/Library/Audio/Plug-Ins/VST3/ABL3x.vst3"
buffer_size = 512
channels = 1
accent_from = 101
preroll = 1.0
wake_note = 60
state = { MidiMode = 1, VCAClicks = 0, OutputClipping = 0 }

[references.parameters]
waveform = "303 Saw"
volume = 0.75
highpass = 0.0
drive = 0.0
distort = 0.0
reso_trim = 0.5
gate_trim = 0.5
vcf_trim = 0.5
bass_boost = 0.5
treble_boost = 0.5
detune = 0.5
pregain = 0.0
vco_base = 0.5
noise_level = 0.0
vco_shift = 0.0
cutoff = 0.5
resonance = 0.25
envmod = 0.5
decay = 0.5
accent = 0.5

[report]
kind = "gate"
title = "The gate's length, against Acid V and ABL3"
columns = 3
about = """
One C-1 in each case, held for a 128th note at 120 BPM, about 16 ms, to a quarter, \
500 ms. How far its level falls while it's held, and how quickly it dies once it's let \
go, are the VCA's and the gate's timing. Knobs as in the slides.

Every case renders on three sides: our Acid, Arturia's Acid V on its Default preset with its \
sequencer off, and AudioRealism's ABL3 set up as a stock 303, in its Note mode. Where Acid V \
and ABL3 agree, that's the target; where they disagree, both are shown. Acid V accents a note \
from velocity 100, ABL3 from 101 and ours from 0x70, so a plain note plays at 99 and an \
accent at 0x70 on every side.
"""

[[cases]]
name = "held-128th"
notes = [
  { time = 0.05, length = 0.015625, note = 36 },
]

[[cases]]
name = "held-64th"
notes = [
  { time = 0.05, length = 0.03125, note = 36 },
]

[[cases]]
name = "held-32nd"
notes = [
  { time = 0.05, length = 0.0625, note = 36 },
]

[[cases]]
name = "held-16th"
notes = [
  { time = 0.05, length = 0.125, note = 36 },
]

[[cases]]
name = "held-8th"
notes = [
  { time = 0.05, length = 0.25, note = 36 },
]

[[cases]]
name = "held-quarter"
notes = [
  { time = 0.05, length = 0.5, note = 36 },
]
