# The Diode's and Dirty's Res knob, which have no circuit of The Drop to compare with, over 33
# steps at three cutoffs, measured against their own drawings (#333). Written by taper_specs.py.
#
#   uv run run.py specs/filter-taper-ours.toml --report out/filter-taper-ours.html
rate = 48000
duration = 2.5

[input]
signal = "sweep"
from = 20.0
to = 20000.0
level = -30.0
seconds = 2.0

[ours]

[report]
kind = "taper"
title = "Diode's and Dirty's Res"
figure = ["filter", "mode"]
column = "cut"
knob = "res"
reference_knob = []
width = []
about = """
Our track filter's Diode, a 303's diode ladder, and Vital's Dirty filter, each at its 24 dB \
low-pass, which The Drop has no circuit like. Each is measured against its own drawing on the \
Sound page, and its taper set to be like the others'.

Res is turned in 33 steps, 00 to FF, at three cutoffs, about 200 Hz, 988 Hz and 5 kHz, with \
the same quiet sine sweep as the other filter reports.
"""

