# The Space Echo's wow and flutter against Delay TAPE-201's (#712, decision 337): a held 1 kHz sine
# through the first head, its pitch tracked, at `Wow` against TAPE-201's `Flutter` from none to
# all, and at the full amount with the tape slow and fast, as its wobble goes with its speed.
#
#   uv run run.py specs/echo-wow.toml --report out/echo-wow.html

rate = 48000

[input]
signal = "sine"
frequency = 1000.0
level = -20.0
seconds = 12.0

[ours]
effects = ["echo"]

[ours.settings]
1.echo.mode = 0
1.echo.rate = 0x69
1.echo.intensity = 0x00
1.echo.reverb = 0x00
1.echo.mix = 0xFF

[reference]
plugin = "/Library/Audio/Plug-Ins/VST3/Delay TAPE-201.vst3"
buffer_size = 512
preset = "Default"
preroll = 3.0

[reference.parameters]
rates_sync = false
rates_link = true
mode_selector = "1"
repeat_rate_left_ms = 150.0
repeat_rate_right_ms = 150.0
dry_wet = 1.0
echo_amount = 1.0
reverb_amount = 0.0
intensity = 0.0
noise = 0.0
input_drive_db = 0.0
stereo_width = 0.0
stereo_rate_offset = 0.0
bass = 0.0
treble = 0.0
delay_type = "L/R"
input_eq_on_off = false
lfo_destination = "None"

[report]
kind = "echo"
measure = "wow"
frequency = 1000.0
window = [1.5, 11.5]
title = "Space Echo's wow against TAPE-201"
about = """
A 1 kHz sine at -20 dBFS held through the first head alone, all wet, with nothing fed back, its \
pitch read every millisecond from its phase. `Wow` `00`, `0D`, `80` and `FF` against TAPE-201's \
`Flutter` 0, 0.05, 0.5 and 1; then all the way with the tape at 500 and 50 ms, `Rate` `3C` and \
`A6`. TAPE-201's wobble is a capstan's, a turn and its harmonics, faster as the tape is; ours \
drifts a little in rate at random, from the track's seed.
"""

[[cases]]
name = "none"
ours = { 1.echo.wow = 0x00 }
reference = { flutter = 0.0 }

[[cases]]
name = "default"
ours = { 1.echo.wow = 0x0D }
reference = { flutter = 0.05 }

[[cases]]
name = "half"
ours = { 1.echo.wow = 0x80 }
reference = { flutter = 0.5 }

[[cases]]
name = "full"
ours = { 1.echo.wow = 0xFF }
reference = { flutter = 1.0 }

[[cases]]
name = "full-500ms"
ours = { 1.echo.wow = 0xFF, 1.echo.rate = 0x3C }
reference = { flutter = 1.0, repeat_rate_left_ms = 500.0, repeat_rate_right_ms = 500.0 }

[[cases]]
name = "full-50ms"
ours = { 1.echo.wow = 0xFF, 1.echo.rate = 0xA6 }
reference = { flutter = 1.0, repeat_rate_left_ms = 50.0, repeat_rate_right_ms = 50.0 }
