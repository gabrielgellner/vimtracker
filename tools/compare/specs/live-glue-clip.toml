# Our Glue compressor's Peak Clip against Ableton Live's Glue Compressor's Peak Clip In: the
# harmonics each adds to a 1 kHz sine stepped from -12 to +12 dBFS with the compressor doing
# nothing, its Range at 0 dB, then with the output turned up 12 dB and at half dry, which show
# where the clip sits, and a 2311 Hz sine, whose aliases fall between its harmonics (#338, #364).
# Ours is fitted to these.
#
#   uv run run.py specs/live-glue-clip.toml --report out/live-glue-clip.html

rate = 48000

[input]
signal = "steps"
frequency = 1000.0
from = -12.0
to = 12.0
step = 1.0
hold = 0.1

[ours]
effects = ["comp"]

[ours.settings]
1.comp.type = "Glue"
1.comp.threshold = 0xFF       # 0 dB
1.comp.glueratio = "4:1"
1.comp.glueattack = "10 ms"
1.comp.gluerelease = "0.1 s"
1.comp.range = 0x00
1.comp.makeup = 0x00
1.comp.auto = "Off"
1.comp.mix = 0xFF
1.comp.peakclip = "On"

[[references]]
name = "Glue"
live = "Glue Compressor"

[references.parameters]
Threshold = "0 dB"
Ratio = 4
Attack = 10
Release = 0.1
Range = "0 dB"
Output = "0 dB"
"Dry/Wet" = "100 %"
"Peak Clip In" = "On"

[report]
kind = "distortion"
title = "Glue compressor's Peak Clip against Glue Compressor"
about = """
Our Glue compressor's Peak Clip, in a track's first slot, against Ableton Live's Glue \
Compressor's Peak Clip In, by the harmonics each adds to a sine at stepped levels, with each \
compressor's Range at 0 dB, so it turns nothing down and only the clip is heard.

`on` steps a 1 kHz sine from -12 to +12 dBFS a decibel at a time; `off` is the same with the clip \
switched out, which leaves it as it was. `output` steps from -24 to 0 dBFS with the output turned \
up 12 dB, and `mix` with the dry/wet at half, which show the clip comes after both: the first \
clips as `on` does 12 dB sooner, and the second clips the blend. `alias` is a 2311 Hz sine from \
-6 to +6 dBFS, whose aliases fall between its harmonics.

Glue's clip is a curve of what comes in, sample by sample: nothing under -2 dBFS, and flat at \
-0.5 dBFS from +0.8 dBFS. Ours is the same curve. Ours sets the output and mix by the nearest \
step on its 00 to FF scales, 12.05 dB and 50.2%.
"""

[[cases]]
name = "on"

[[cases]]
name = "off"
ours = { 1.comp.peakclip = "Off" }
references = { Glue = { "Peak Clip In" = "Off" } }

[[cases]]
name = "output"
input = { from = -24.0, to = 0.0, step = 2.0 }
ours = { 1.comp.makeup = 0x80 }
references = { Glue = { Output = "12 dB" } }

[[cases]]
name = "mix"
input = { from = -24.0, to = 0.0, step = 2.0 }
ours = { 1.comp.mix = 0x80 }
references = { Glue = { "Dry/Wet" = "50 %" } }

[[cases]]
name = "alias"
input = { frequency = 2311.0, from = -6.0, to = 6.0, step = 3.0, hold = 0.25 }
