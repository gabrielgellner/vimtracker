# Arturia's Acid V against our Acid: the Env Mod knob in sixteen steps on one C-2, with the
# other knobs at noon (#295, decision 117).
#
#   uv run run.py specs/acid-envmod.toml --report out/acid-envmod.html

rate = 48000
duration = 1

[[notes]]
time = 0.05
length = 0.6
note = 36
velocity = 99

[ours]
machine = "acid"

[ours.settings]
acid.wave = "Saw"
acid.cutoff = 0x80
acid.resonance = 0x80
acid.decay = 0x80
acid.accent = 0x80
acid.drive = 0x00

[reference]
plugin = "/Library/Audio/Plug-Ins/VST3/Acid V.vst3"
buffer_size = 512
# Acid V opens with whatever preset it last had, so each case starts from its factory Default,
# with its sequencer off so a held key plays one note rather than a pattern (arturia.py).
preset = "Default"
state = { Sequencer_OnOff = 0 }

[reference.parameters]
master_volume_db = 0.0
osc_pitch_st = 12.0        # Acid V plays MIDI 36 at 32.7 Hz, an octave under ours
osc_waveform = 0.0
distortion_dry_wet = 0.0
sub_osc_volume_db = -70.0
noise_db = -100.0          # its hiss, which would brighten a quiet note's centroid
cutoff = 0.5
resonance = 0.5
decay = 0.5
accent = 0.5

[report]
kind = "knob"
title = "Acid's Env Mod knob against Acid V's"
knob = "acid.envmod"
reference_knob = "envelope_mod"
measure = "note"
about = """
Our Acid's Env Mod and Acid V's, each turned from bottom to top in sixteen even steps, with the \
other knobs at noon. Each step plays one C-2 for 0.6 s, and the whole render's spectral centroid \
and peak level are measured. A 303's Env Mod can't take the envelope's sweep down to nothing.

Acid V opens with whatever preset it last had, so each case starts from its factory Default \
preset with its sequencer switched off. It plays MIDI 36 an octave under ours, so its oscillator \
is raised 12 semitones to play the same pitch. Its distortion and sub oscillator are off, as our \
Acid has neither, and so is its hiss. It accents a note from velocity 100 and ours from 0x70, so \
a plain note is played at 99 and an accent at 0x70.
"""

[[cases]]
name = "envmod-00"
ours = { acid.envmod = 0x00 }
reference = { envelope_mod = 0 }

[[cases]]
name = "envmod-10"
ours = { acid.envmod = 0x10 }
reference = { envelope_mod = 0.0625 }

[[cases]]
name = "envmod-20"
ours = { acid.envmod = 0x20 }
reference = { envelope_mod = 0.125 }

