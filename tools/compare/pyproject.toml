[project]
name = "vimtracker-compare"
version = "0.1.0"
description = "Renders one spec through vimtracker and a reference plugin, and compares them (#186)"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    # 0.9.26 hosts Arturia's and u-he's plugins headless, checked on 2026-11-10.
    "pedalboard==0.9.26",
    "numpy>=2.3",
    "scipy>=1.16",
    "mido>=1.3",
    "matplotlib>=3.11.2",
]

[tool.uv]
package = false
