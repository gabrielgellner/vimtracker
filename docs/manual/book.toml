[book]
title = "vimtracker"
description = "A music tracker for the terminal, edited with a keyboard grammar modelled on Neovim."
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
# The address on GitHub Pages, so the not-found page links back to the manual.
site-url = "/vimtracker/"
