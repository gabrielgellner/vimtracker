[workspace]
resolver = "3"
members = ["crates/vt-model", "crates/vt-engine", "crates/vt-roto", "crates/vt-tui"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/gabrielgellner/vimtracker"
# The compiler `rust-toolchain.toml` pins.
rust-version = "1.100.0"

# What every crate warns on, taken with `lints.workspace = true`. A crate's own extra, such as
# `unreachable_pub` in `vt-engine`, `vt-tui` and `vt-roto`, stays in its `lib.rs`.
[workspace.lints.clippy]
float_cmp = "warn"
match_same_arms = "warn"
redundant_clone = "warn"

[workspace.dependencies]
# Caret ranges, as `Cargo.lock` keeps builds reproducible, and `=` only for a crate whose
# arithmetic a golden render hears (CONTRIBUTING.md, decision 352).
vt-model = { path = "crates/vt-model" }
vt-engine = { path = "crates/vt-engine" }
vt-roto = { path = "crates/vt-roto" }
serde = { version = "1.0.229", features = ["derive", "rc"] }
ron = "0.12.3"
hound = "3.5.1"
symphonia = { version = "0.6.1", default-features = false, features = ["aiff", "flac", "pcm", "wav"] }
rubato = "5.0.1"
# The onset function's spectra, and `Clouds`' spectral mode. MIT or Apache-2.0. Already in the
# tree, through rubato. Pinned exactly, as `Clouds`' golden renders hear its arithmetic.
realfft = "=3.5.1"
thiserror = "2.0.21"
base64 = "0.23.1"
rtrb = "0.4.1"
# Four lanes at once for the voices that run the same code side by side, as `Supersaw`'s stack
# does. Zlib, Apache-2.0 or MIT. Pinned exactly, as the Supersaw's and the 4-op's golden renders
# hear its arithmetic.
wide = "=1.7.1"
ratatui = "0.30.2"
cpal = "0.18.2"
clap = { version = "4.6.7", features = ["derive"] }
nucleo-matcher = "0.3.1"
flate2 = "1.1.10"
roxmltree = "0.21.2"
libc = "0.2.191"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
# Low Power Mode and the thermal state, for the CPU figure's leaf. Both are already in the tree,
# through cpal.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSUserDefaults"] }
# The Roto-Control's MIDI ports, through CoreMIDI on macOS and ALSA on Linux, which cpal already
# links for audio.
midir = "0.11.1"
# The Roto-Control's USB serial port, for reading and writing its setups. Without libudev, so
# Linux needs no more than the ALSA headers the audio output already does.
serialport = { version = "4.10.1", default-features = false }
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "display", "serde"] }

# The engine and the model optimised in debug builds, and so in the tests, which take a few
# times as long unoptimised (#663). Debug assertions and overflow checks stay on, as the rest of
# the dev profile has them. Not 1: the golden hashes hold unoptimised, at 2 and in release
# builds, but 1 rounds a reverb's maths differently.
#
# The opt-level reaches the packages' integration tests too, as Cargo sets it for a whole package.
# Moving them into a package of their own at 0 was measured and left (#719): an edit to a test
# rebuilds in about a second at 2 with incremental builds, but the engine's `#[inline]` DSP built
# into a test at 0 made a full run take about 15% more CPU.
[profile.dev.package.vt-engine]
opt-level = 2

[profile.dev.package.vt-model]
opt-level = 2

# The FFT under `Clouds`' spectral mode, which the tests play for seconds at a time.
[profile.dev.package.rustfft]
opt-level = 2

[profile.dev.package.realfft]
opt-level = 2

# A release build with symbols, for a profiler.
[profile.profiling]
inherits = "release"
debug = true
